<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fadi Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1><b>FADI LAB</b></h1>
      <nav class="tabs" id="tabs">
        <button data-tab="review" class="active">Animation Review</button>
        <button data-tab="complab">Composition Lab</button>
        <button data-tab="micro" disabled title="coming soon">
          Micrographics · soon
        </button>
      </nav>
    </header>

    <!-- ===================== ANIMATION REVIEW ===================== -->
    <section id="tab-review" class="tab active">
      <div class="toolbar">
        <span class="stat" id="stat">—</span>
        <div class="spacer"></div>
        <button class="toggle active" id="vGrid">Grid</button>
        <button class="toggle" id="vFocus">Focus</button>
        <select id="filter">
          <option value="todo">To review</option>
          <option value="all">All</option>
          <option value="rated">Rated</option>
          <option value="trashed">Trashed</option>
          <option value="commented">Commented</option>
          <option value="5">5★</option>
          <option value="4">4+★</option>
          <option value="3">3+★</option>
          <option value="lt3">&lt;3★</option>
        </select>
        <select id="catf"></select>
        <select id="sort">
          <option value="num">Order</option>
          <option value="rating">Rating</option>
          <option value="category">Category</option>
        </select>
        <input type="text" id="search" placeholder="search…" />
        <button class="accent" id="export" title="download ratings.json">
          ⬇ Export
        </button>
        <button class="accent" id="import" title="load a ratings.json">
          ⬆ Import
        </button>
        <input
          type="file"
          id="file"
          accept="application/json"
          style="display: none"
        />
      </div>

      <div class="grid" id="grid"></div>

      <div id="focus">
        <div class="fmedia" id="fmedia"></div>
        <div class="fbar">
          <span class="fname" id="fname"></span
          ><span class="cat" id="fcat"></span>
          <div class="stars" id="fstars"></div>
          <button id="fTrash">🗑 Trash</button>
          <div class="fnav">
            <button id="fPrev">← Prev</button><button id="fNext">Next →</button>
          </div>
        </div>
        <textarea
          id="fcomment"
          placeholder="comment / what to change…"
        ></textarea>
        <div class="meta" id="fmeta" style="display: block"></div>
        <div class="hint">
          <kbd>1</kbd>–<kbd>5</kbd> rate · <kbd>0</kbd> clear ·
          <kbd>T</kbd> trash · <kbd>←</kbd><kbd>→</kbd> nav · auto-advances
        </div>
      </div>
    </section>

    <!-- ===================== COMPOSITION LAB ===================== -->
    <section id="tab-complab" class="tab">
      <div class="cl-shell" id="clShell">
        <aside class="cl-presets" id="clPresets"></aside>

        <div class="cl-stage" id="clStage">
          <div class="cl-canvas-wrap" id="clCanvasWrap">
            <canvas id="clCanvas" width="405" height="720"></canvas>
            <div class="cl-empty" id="clEmpty">
              Load a clip (or drag one in) to begin →
            </div>

            <!-- mobile feed overlay (CSS-hidden on desktop) -->
            <div class="feed-ui" id="feedUI">
              <div class="feed-top">
                <span class="feed-label" id="feedLabel">—</span>
                <span class="feed-count" id="feedCount">—</span>
              </div>
              <div class="feed-hint" id="feedHint">swipe ↑ ↓ to browse</div>
              <div class="feed-verdict" id="feedVerdict"></div>
              <div class="feed-actions">
                <button id="feedPrev" class="fb-nav" aria-label="previous">
                  ↑
                </button>
                <button id="feedNope" class="fb-nope" aria-label="pass">
                  ✕
                </button>
                <button id="feedLike" class="fb-like" aria-label="like">
                  ♥
                </button>
                <button id="feedNext" class="fb-nav" aria-label="next">
                  ↓
                </button>
                <button id="feedMore" class="fb-more" aria-label="controls">
                  ⋯
                </button>
              </div>
            </div>
          </div>
          <div class="cl-transport">
            <button id="clPlay" title="play / pause">▶</button>
            <input type="range" id="clSeek" min="0" max="1000" value="0" />
            <span class="stat" id="clTime">0:00 / 0:00</span>
            <label class="cl-file" id="clClipLbl"
              >＋ Clip<input type="file" id="clClip" accept="video/*" hidden
            /></label>
            <label class="cl-file" id="clMatteLbl"
              >＋ Matte<input type="file" id="clMatte" accept="video/*" hidden
            /></label>
            <button id="clSnap" title="save PNG frame">⤓ PNG</button>
            <button id="clRec" title="record canvas to webm">● REC</button>
          </div>
        </div>

        <aside class="cl-params" id="clParamsPanel">
          <div class="sheet-head">
            <span class="sheet-grip"></span>
            <span class="sheet-title">Controls</span>
            <button id="sheetClose">Done</button>
          </div>
          <div id="clParams"></div>

          <div class="cl-fb">
            <div class="cl-section-h">Rate this look</div>
            <div class="stars" id="clStars"></div>
            <textarea
              id="clFbNote"
              placeholder="note / what to change…"
            ></textarea>
            <button id="clSaveLook" class="accent">★ Save look</button>
            <div class="cl-fb-head">
              <span id="clLooksCount">Saved looks (0)</span>
              <span class="spacer"></span>
              <button id="clCopyFb" title="copy feedback to paste to Claude">
                📋 Copy for Claude
              </button>
              <button id="clClearFb" title="clear saved looks">clear</button>
            </div>
            <div id="clLooks" class="cl-looks"></div>
          </div>

          <div class="cl-recipe">
            <div class="cl-recipe-head">
              ffmpeg recipe
              <span class="spacer"></span>
              <button id="clCopy">copy</button>
              <button id="clSaveRecipe">save .json</button>
            </div>
            <pre id="clRecipe">—</pre>
            <div class="cl-note" id="clNote"></div>
          </div>
        </aside>
      </div>

      <!-- kept in-layout (1px) not display:none, so iOS Safari actually decodes/plays them -->
      <video
        id="clVid"
        class="cl-src"
        playsinline
        webkit-playsinline
        muted
        loop
      ></video>
      <video
        id="clMat"
        class="cl-src"
        playsinline
        webkit-playsinline
        muted
        loop
      ></video>
    </section>

    <script src="review.js"></script>
    <script src="complab.js"></script>
    <script>
      // ---- tab router ----
      (function () {
        const tabs = document.getElementById("tabs");
        function show(name) {
          document
            .querySelectorAll(".tabs button")
            .forEach((b) =>
              b.classList.toggle("active", b.dataset.tab === name),
            );
          document
            .querySelectorAll(".tab")
            .forEach((s) =>
              s.classList.toggle("active", s.id === "tab-" + name),
            );
          if (name === "complab" && window.CompLab) CompLab.onShow();
          else if (window.CompLab) CompLab.onHide();
          try {
            localStorage.setItem("fadi-lab-tab", name);
          } catch (e) {}
        }
        tabs.addEventListener("click", (e) => {
          const b = e.target.closest("button[data-tab]");
          if (!b || b.disabled) return;
          show(b.dataset.tab);
        });
        let start = "complab"; // lightweight landing (1 clip) — mobile-safe
        try {
          start = localStorage.getItem("fadi-lab-tab") || "complab";
        } catch (e) {}
        show(start);
      })();
    </script>
  </body>
</html>
